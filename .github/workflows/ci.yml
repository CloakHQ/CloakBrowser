name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -v -m "not slow"

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Install and build
        run: cd js && npm install && npm run build
      - name: Typecheck
        run: cd js && npm run typecheck
      - name: Run tests
        run: cd js && npm test

  javascript-browser:
    # Humanize engine + Puppeteer tests against the real CloakBrowser binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Install and build
        run: cd js && npm install && npm run build
      - name: Download the binary
        run: |
          cd js
          echo "CLOAKBROWSER_BINARY_PATH=$(node -e "import('./dist/index.js').then(async m => console.log(await m.ensureBinary()))" | tail -1)" >> "$GITHUB_ENV"
      - name: Install browser system deps
        run: cd js && npx playwright-core install-deps chromium
      - name: Run real-browser tests
        run: cd js && xvfb-run -a npx vitest run tests/humanizeEngine.test.ts tests/humanizePuppeteer.test.ts

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build dotnet/CloakBrowser.sln -c Release
      - name: Run tests
        run: dotnet test dotnet/CloakBrowser.sln -c Release --no-build
