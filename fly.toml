app = "cloakbrowser-cdp-change-me"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "/usr/local/bin/fly-entrypoint"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"