app = "cloakbrowser-control-change-me"

[build]
  dockerfile = "Dockerfile.dashboard"

[env]
  DATABASE_PATH = "/data/control_plane.sqlite3"
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "control_data"
  destination = "/data"
  initial_size = "1gb"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
