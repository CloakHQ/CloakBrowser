[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloakbrowser"
dynamic = ["version"]
description = "Stealth Chromium that passes every bot detection test. Drop-in Playwright replacement with source-level fingerprint patches."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "CloakHQ", email = "cloakhq@pm.me" },
]
keywords = [
    "stealth",
    "browser",
    "chromium",
    "playwright",
    "puppeteer",
    "scraping",
    "web-scraping",
    "anti-detect",
    "antidetect",
    "undetected",
    "bot-detection",
    "fingerprint",
    "recaptcha",
    "cloudflare",
    "turnstile",
    "datadome",
    "captcha",
    "headless",
    "automation",
    "ai-agent",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.40",
    "httpx>=0.24",
    "cryptography>=41.0",  # verify Ed25519 signature on SHA256SUMS before trusting it
    "geoip2>=4.0",  # geoip is on by default, so its reader ships with the wrapper
    "socksio>=1.0",  # SOCKS5 transport for httpx (exit-IP lookup through a SOCKS proxy)
]

[project.optional-dependencies]
# Kept as a no-op alias: geoip2/socksio moved into the base dependencies when
# geoip became the default, but `pip install 'cloakbrowser[geoip]'` is pinned in
# user CI and older docs, so the extra must keep resolving.
geoip = []
serve = ["aiohttp>=3.9", "websockets>=12.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
cloakbrowser = "cloakbrowser.__main__:main"

[project.urls]
Homepage = "https://github.com/CloakHQ/CloakBrowser"
Documentation = "https://github.com/CloakHQ/CloakBrowser#readme"
Repository = "https://github.com/CloakHQ/CloakBrowser"
Issues = "https://github.com/CloakHQ/CloakBrowser/issues"

[tool.hatch.version]
path = "cloakbrowser/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that hit live detection sites (deselect with '-m \"not slow\"')",
    "real_geoip: opts out of the conftest GeoIP egress stub (the test exercises those seams itself)",
]
